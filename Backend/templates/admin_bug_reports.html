<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>버그 신고 관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">
    <div class="border-b border-slate-200 bg-white/90 backdrop-blur">
        <div class="mx-auto flex max-w-7xl items-center justify-between gap-3 px-5 py-4 sm:px-6">
            <div>
                <h1 class="text-2xl font-bold">버그 신고 관리</h1>
                <p class="mt-1 text-sm text-slate-500">접수된 버그 내용을 확인하고 해결 여부를 변경합니다.</p>
            </div>
            <div class="flex items-center gap-2">
                <a href="/account"
                   class="inline-flex items-center rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100">
                    설정으로
                </a>
                <a href="/"
                   class="inline-flex items-center rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100">
                    메인으로
                </a>
            </div>
        </div>
    </div>

    <main class="mx-auto max-w-7xl px-5 py-6 sm:px-6">
        <section class="grid gap-3 sm:grid-cols-3">
            <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
                <p class="text-sm font-semibold text-slate-500">전체</p>
                <p id="bugReportTotalCount" class="mt-2 text-3xl font-bold text-slate-800">0</p>
            </div>
            <div class="rounded-2xl border border-amber-200 bg-amber-50 p-4 shadow-sm">
                <p class="text-sm font-semibold text-amber-700">미해결</p>
                <p id="bugReportOpenCount" class="mt-2 text-3xl font-bold text-amber-700">0</p>
            </div>
            <div class="rounded-2xl border border-emerald-200 bg-emerald-50 p-4 shadow-sm">
                <p class="text-sm font-semibold text-emerald-700">해결</p>
                <p id="bugReportResolvedCount" class="mt-2 text-3xl font-bold text-emerald-700">0</p>
            </div>
        </section>

        <section class="mt-5 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
            <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                <div>
                    <h2 class="text-lg font-bold text-slate-800">접수 목록</h2>
                    <p class="text-sm text-slate-500">최신순으로 최대 200건까지 보여줍니다.</p>
                </div>
                <div class="flex flex-wrap gap-2">
                    <button type="button" data-status-filter="open"
                            class="rounded-full bg-slate-800 px-4 py-2 text-sm font-semibold text-white">
                        미해결
                    </button>
                    <button type="button" data-status-filter="resolved"
                            class="rounded-full border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100">
                        해결
                    </button>
                    <button type="button" data-status-filter="all"
                            class="rounded-full border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100">
                        전체
                    </button>
                </div>
            </div>
            <p id="bugReportMessage" class="mt-3 hidden text-sm"></p>
        </section>

        <section id="bugReportLoading" class="mt-5 hidden rounded-2xl border border-slate-200 bg-white px-4 py-10 text-center text-sm text-slate-500 shadow-sm">
            목록을 불러오는 중입니다.
        </section>

        <section id="bugReportEmptyState" class="mt-5 hidden rounded-2xl border border-dashed border-slate-300 bg-slate-50 px-4 py-14 text-center shadow-sm">
            <p class="text-base font-semibold text-slate-700">표시할 버그 신고가 없습니다.</p>
            <p class="mt-2 text-sm text-slate-500">필터를 바꾸거나 새로고침해 주세요.</p>
        </section>

        <section id="bugReportList" class="mt-5 grid gap-4"></section>
    </main>

    <script>
        const totalCountEl = document.getElementById("bugReportTotalCount");
        const openCountEl = document.getElementById("bugReportOpenCount");
        const resolvedCountEl = document.getElementById("bugReportResolvedCount");
        const messageEl = document.getElementById("bugReportMessage");
        const loadingEl = document.getElementById("bugReportLoading");
        const emptyStateEl = document.getElementById("bugReportEmptyState");
        const listEl = document.getElementById("bugReportList");
        const filterButtons = Array.from(document.querySelectorAll("[data-status-filter]"));

        let activeStatus = "open";
        let loadInFlight = false;

        function escapeHtml(value) {
            return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function formatDate(value) {
            if (!value) return "-";
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return "-";
            return date.toLocaleString("ko-KR");
        }

        function setMessage(text, type) {
            if (!messageEl) return;
            if (!text) {
                messageEl.classList.add("hidden");
                messageEl.textContent = "";
                return;
            }

            messageEl.classList.remove("hidden", "text-red-600", "text-emerald-600");
            messageEl.classList.add(type === "success" ? "text-emerald-600" : "text-red-600");
            messageEl.textContent = text;
        }

        function renderCounts(counts) {
            totalCountEl.textContent = String(counts?.total || 0);
            openCountEl.textContent = String(counts?.open || 0);
            resolvedCountEl.textContent = String(counts?.resolved || 0);
        }

        function syncFilterButtons() {
            filterButtons.forEach((button) => {
                const isActive = button.dataset.statusFilter === activeStatus;
                button.classList.toggle("bg-slate-800", isActive);
                button.classList.toggle("text-white", isActive);
                button.classList.toggle("border", !isActive);
                button.classList.toggle("border-slate-300", !isActive);
                button.classList.toggle("bg-white", !isActive);
                button.classList.toggle("text-slate-700", !isActive);
                button.classList.toggle("hover:bg-slate-100", !isActive);
            });
        }

        function renderReportCard(report) {
            const resolved = Boolean(report?.resolved);
            const statusClass = resolved
                ? "border-emerald-200 bg-emerald-50 text-emerald-700"
                : "border-amber-200 bg-amber-50 text-amber-700";
            const statusLabel = resolved ? "해결" : "미해결";
            const toggleLabel = resolved ? "미해결로 변경" : "해결로 변경";
            const pagePath = escapeHtml(report?.page_path || "-");
            const pageTitle = escapeHtml(report?.page_title || "");
            const pageUrl = String(report?.page_url || "").trim();
            const escapedPageUrl = escapeHtml(pageUrl);
            const contentHtml = escapeHtml(report?.content || "");
            const reporterName = escapeHtml(report?.reporter_name || "-");
            const reporterId = escapeHtml(report?.username || "-");
            const createTime = escapeHtml(formatDate(report?.create_time));
            const resolvedTime = escapeHtml(formatDate(report?.resolved_time));
            const images = Array.isArray(report?.image_urls) ? report.image_urls : [];

            const imagesHtml = images.length
                ? `
                    <div class="grid gap-3 sm:grid-cols-2 xl:grid-cols-3">
                        ${images.map((rawUrl, index) => {
                            const safeUrl = escapeHtml(rawUrl);
                            return `
                                <a href="${safeUrl}" target="_blank" rel="noreferrer"
                                   class="group overflow-hidden rounded-xl border border-slate-200 bg-slate-100">
                                    <img src="${safeUrl}" alt="버그 첨부 이미지 ${index + 1}"
                                         class="h-44 w-full object-cover transition duration-200 group-hover:scale-[1.02]">
                                </a>
                            `;
                        }).join("")}
                    </div>
                `
                : `
                    <div class="rounded-xl border border-dashed border-slate-300 bg-slate-50 px-4 py-6 text-sm text-slate-500">
                        첨부된 스크린샷이 없습니다.
                    </div>
                `;

            const pageLinkHtml = pageUrl
                ? `
                    <a href="${escapedPageUrl}" target="_blank" rel="noreferrer"
                       class="inline-flex items-center rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-xs font-semibold text-slate-700 hover:bg-slate-100">
                        신고 화면 열기
                    </a>
                `
                : "";

            return `
                <article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm" data-report-card="${report.bug_report_id}">
                    <div class="flex flex-col gap-4 xl:flex-row xl:items-start xl:justify-between">
                        <div class="min-w-0 flex-1">
                            <div class="flex flex-wrap items-center gap-2">
                                <span class="inline-flex rounded-full border px-3 py-1 text-xs font-bold ${statusClass}">
                                    ${statusLabel}
                                </span>
                                <span class="text-xs text-slate-500">접수 #${report.bug_report_id}</span>
                            </div>
                            <div class="mt-3 grid gap-2 text-sm text-slate-600 sm:grid-cols-2 xl:grid-cols-4">
                                <div>
                                    <p class="text-xs font-semibold uppercase tracking-wide text-slate-400">작성자</p>
                                    <p class="mt-1 font-semibold text-slate-800">${reporterName}</p>
                                    <p class="text-xs text-slate-500">@${reporterId}</p>
                                </div>
                                <div>
                                    <p class="text-xs font-semibold uppercase tracking-wide text-slate-400">접수 시각</p>
                                    <p class="mt-1 font-semibold text-slate-800">${createTime}</p>
                                </div>
                                <div>
                                    <p class="text-xs font-semibold uppercase tracking-wide text-slate-400">해결 시각</p>
                                    <p class="mt-1 font-semibold text-slate-800">${resolvedTime}</p>
                                </div>
                                <div>
                                    <p class="text-xs font-semibold uppercase tracking-wide text-slate-400">신고 화면</p>
                                    <p class="mt-1 font-semibold text-slate-800 break-all">${pagePath}</p>
                                    ${pageTitle ? `<p class="text-xs text-slate-500">${pageTitle}</p>` : ""}
                                </div>
                            </div>
                        </div>
                        <div class="flex shrink-0 flex-wrap items-center gap-2">
                            ${pageLinkHtml}
                            <button type="button"
                                    data-toggle-report="true"
                                    data-id="${report.bug_report_id}"
                                    data-resolved="${resolved ? "true" : "false"}"
                                    class="inline-flex items-center rounded-lg px-4 py-2 text-sm font-bold text-white ${resolved ? "bg-slate-700 hover:bg-slate-800" : "bg-emerald-600 hover:bg-emerald-700"}">
                                ${toggleLabel}
                            </button>
                        </div>
                    </div>

                    <div class="mt-5 rounded-2xl bg-slate-50 px-4 py-4">
                        <p class="text-xs font-semibold uppercase tracking-wide text-slate-400">신고 내용</p>
                        <p class="mt-2 whitespace-pre-wrap break-words text-sm leading-6 text-slate-700">${contentHtml}</p>
                    </div>

                    <div class="mt-5">
                        <p class="mb-3 text-xs font-semibold uppercase tracking-wide text-slate-400">첨부 이미지</p>
                        ${imagesHtml}
                    </div>
                </article>
            `;
        }

        function renderReports(reports) {
            const list = Array.isArray(reports) ? reports : [];
            listEl.innerHTML = list.map(renderReportCard).join("");
            emptyStateEl.classList.toggle("hidden", list.length > 0);
        }

        async function loadReports(nextStatus) {
            if (loadInFlight) return;
            activeStatus = nextStatus || activeStatus;
            syncFilterButtons();
            setMessage("", "error");
            loadingEl.classList.remove("hidden");
            emptyStateEl.classList.add("hidden");
            listEl.innerHTML = "";
            loadInFlight = true;

            try {
                const res = await fetch(`/api/admin/bug-reports?status=${encodeURIComponent(activeStatus)}`);
                const payload = await res.json().catch(() => ({}));
                if (!res.ok) {
                    throw new Error(payload.detail || "버그 신고 목록을 불러오지 못했습니다.");
                }

                renderCounts(payload?.counts || {});
                renderReports(payload?.reports || []);
            } catch (error) {
                renderCounts({ total: 0, open: 0, resolved: 0 });
                renderReports([]);
                setMessage(error.message || "버그 신고 목록을 불러오지 못했습니다.", "error");
            } finally {
                loadingEl.classList.add("hidden");
                loadInFlight = false;
            }
        }

        filterButtons.forEach((button) => {
            button.addEventListener("click", () => {
                const nextStatus = String(button.dataset.statusFilter || "").trim();
                if (!nextStatus || nextStatus === activeStatus) return;
                loadReports(nextStatus);
            });
        });

        listEl.addEventListener("click", async (event) => {
            const toggleButton = event.target.closest("[data-toggle-report]");
            if (!toggleButton) return;

            const bugReportId = String(toggleButton.dataset.id || "").trim();
            if (!bugReportId) return;

            const nextResolved = toggleButton.dataset.resolved !== "true";
            toggleButton.disabled = true;
            setMessage("", "error");

            try {
                const res = await fetch(`/api/admin/bug-reports/${encodeURIComponent(bugReportId)}`, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ resolved: nextResolved }),
                });
                const payload = await res.json().catch(() => ({}));
                if (!res.ok) {
                    throw new Error(payload.detail || "상태 변경에 실패했습니다.");
                }

                setMessage("상태를 변경했습니다.", "success");
                await loadReports(activeStatus);
            } catch (error) {
                setMessage(error.message || "상태 변경에 실패했습니다.", "error");
                toggleButton.disabled = false;
            }
        });

        syncFilterButtons();
        loadReports(activeStatus);
    </script>
    <script src="/statics/js/bug-report-widget.js"></script>
</body>
</html>
