<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>통합 조회</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <header class="bg-white border-b border-slate-200 shadow-sm">
        <div class="max-w-[1500px] mx-auto px-6 py-4 flex items-center justify-between">
            <div>
                <h1 class="text-xl font-bold text-slate-800">고객/빌딩 통합 조회</h1>
                <p class="text-sm text-slate-500">매수조건 기반 재검색 + 고객/빌딩 분리 섹션</p>
            </div>
            <button type="button" onclick="handleCancel()" class="px-4 py-2 rounded-lg bg-slate-700 text-white font-semibold hover:bg-slate-800">
                취소
            </button>
        </div>
    </header>

    <main class="max-w-[1500px] mx-auto px-6 py-6">
        <section class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
            <div class="flex items-center justify-between mb-2">
                <h2 class="font-bold text-slate-700">매수 조건 - 실제 매칭 필터</h2>
                <div class="flex gap-2">
                    <button id="resetBtn" type="button" class="px-4 py-2 rounded-lg bg-slate-200 text-slate-700 font-semibold hover:bg-slate-300">초기화</button>
                    <button id="searchBtn" type="button" class="px-4 py-2 rounded-lg bg-blue-600 text-white font-semibold hover:bg-blue-700">매칭 검색</button>
                </div>
            </div>

            <div class="space-y-2 text-[13px] text-slate-700">
                <div class="flex items-center gap-2 flex-wrap">
                    <span class="font-bold min-w-[70px]">유형 조건:</span>
                    <label class="flex items-center gap-1"><input type="checkbox" name="matchType" value="NEW_SITE"> 신축부지</label>
                    <label class="flex items-center gap-1"><input type="checkbox" name="matchType" value="REMODELING"> 리모델링</label>
                    <label class="flex items-center gap-1"><input type="checkbox" name="matchType" value="OFFICE"> 사옥형</label>
                    <label class="flex items-center gap-1"><input type="checkbox" name="matchType" value="INVESTMENT"> 수익형</label>
                    <label class="flex items-center gap-1"><input type="checkbox" name="matchType" value="DEVELOPMENT"> 개발/전환</label>
                    <label class="flex items-center gap-1"><input type="checkbox" name="matchType" value="STABLE"> 보유안정</label>
                    <span class="font-bold min-w-[60px] ml-3">건물상태:</span>
                    <select id="matchBuildingStatus" class="border-b w-24 text-center outline-none bg-transparent">
                        <option value="전체">전체</option>
                        <option value="준비">준비</option>
                        <option value="완료">완료</option>
                        <option value="매각">매각</option>
                        <option value="보류">보류</option>
                    </select>
                </div>

                <div class="flex items-center gap-2 flex-wrap">
                    <span class="font-bold min-w-[70px]">등급 조건:</span>
                    <select id="matchLocationDecide" class="border-b w-16 text-center outline-none bg-transparent">
                        <option value="">입지</option><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="X">X</option>
                    </select>
                    <select id="matchPriceDecide" class="border-b w-16 text-center outline-none bg-transparent">
                        <option value="">가격</option><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="X">X</option>
                    </select>
                    <select id="matchYieldDecide" class="border-b w-16 text-center outline-none bg-transparent">
                        <option value="">수익률</option><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="X">X</option>
                    </select>
                    <select id="matchVacancyDecide" class="border-b w-16 text-center outline-none bg-transparent">
                        <option value="">명도</option><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="X">X</option>
                    </select>
                    <select id="matchLimitDecide" class="border-b w-16 text-center outline-none bg-transparent">
                        <option value="">제한</option><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="X">X</option>
                    </select>
                    <select id="matchLoanDecide" class="border-b w-16 text-center outline-none bg-transparent">
                        <option value="">상태</option><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="X">X</option>
                    </select>
                </div>

                <div class="flex items-center gap-2 flex-wrap">
                    <span class="font-bold min-w-[70px]">용도지역:</span>
                    <label class="flex items-center gap-1"><input type="checkbox" name="matchZoningCategory" value="COMMERCIAL"> 상업</label>
                    <label class="flex items-center gap-1"><input type="checkbox" name="matchZoningCategory" value="INDUSTRIAL"> 공업</label>
                    <label class="flex items-center gap-1"><input type="checkbox" name="matchZoningCategory" value="RESIDENTIAL"> 주거</label>
                    <label class="flex items-center gap-1"><input type="checkbox" name="matchZoningCategory" value="OTHER"> 기타</label>
                </div>

                <div class="flex items-center gap-2 flex-wrap">
                    <span class="font-bold min-w-[70px]">건축용도:</span>
                    <label class="flex items-center gap-1"><input type="checkbox" name="matchUsageCategory" value="NEIGHBORHOOD"> 근린</label>
                    <label class="flex items-center gap-1"><input type="checkbox" name="matchUsageCategory" value="OFFICE_USE"> 업무</label>
                    <label class="flex items-center gap-1"><input type="checkbox" name="matchUsageCategory" value="LODGING"> 숙박</label>
                    <label class="flex items-center gap-1"><input type="checkbox" name="matchUsageCategory" value="ENTERTAINMENT"> 위락</label>
                    <label class="flex items-center gap-1"><input type="checkbox" name="matchUsageCategory" value="HOUSING"> 주택</label>
                    <label class="flex items-center gap-1"><input type="checkbox" name="matchUsageCategory" value="OTHER"> 기타</label>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">
                    <div class="flex items-center gap-2">
                        <span class="font-bold min-w-[70px]">주소 조건:</span>
                        <input id="matchAddressInput" type="text" class="border-b border-slate-300 outline-none w-52 px-1" placeholder="[ 시 / 구 / 동 / 지번 키워드 ]">
                        <span class="font-bold min-w-[40px] ml-2">상권:</span>
                        <input id="matchBusinessAreaInput" type="text" class="border-b border-slate-300 outline-none w-36 px-1" placeholder="[ 입지 키워드 ]">
                    </div>
                    <div></div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">
                    <div class="flex items-center gap-2">
                        <span class="font-bold min-w-[70px]">주변역:</span>
                        <input id="matchStationKeyword" type="text" class="border-b border-slate-300 outline-none w-28 px-1" placeholder="[ 역명 ]">
                        <span class="font-bold min-w-[40px] ml-2">도보:</span>
                        <input id="matchStationWalkMin" type="text" class="border-b w-10 text-center outline-none" placeholder="1">
                        <span>~</span>
                        <input id="matchStationWalkMax" type="text" class="border-b w-10 text-center outline-none" placeholder="15">
                        <span class="text-[11px] text-slate-500">분</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="font-bold w-24">현금보유액:</span>
                        <input id="matchCashHoldManwon" type="text" class="border-b w-16 text-center outline-none" placeholder="400,000">
                        <span class="text-[11px] text-slate-500">만원</span>
                        <input id="matchCashHoldPercent" type="text" class="border-b w-12 text-center outline-none ml-2" placeholder="60">
                        <span>%</span>
                        <span class="text-[10px] text-slate-400">매매가 ≤ 현금보유액 / (1 - %)</span>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">
                    <div class="flex items-center gap-2">
                        <span class="font-bold w-16">매매가:</span>
                        <input id="matchMinPrice" type="text" class="border-b w-16 text-center" placeholder="1,000">
                        <span>~</span>
                        <input id="matchMaxPrice" type="text" class="border-b w-16 text-center" placeholder="10,000">
                        <span class="text-[11px] text-slate-500">만원</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="font-bold w-16">수익률:</span>
                        <input id="matchMinYieldInput" type="text" class="border-b w-10 text-center outline-none" placeholder="0">
                        <span>%</span>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">
                    <div class="flex items-center gap-2">
                        <span class="font-bold w-24">토지 평단가:</span>
                        <input id="matchLandPyeongMin" type="text" class="border-b w-16 text-center" placeholder="1,000">
                        <span>~</span>
                        <input id="matchLandPyeongMax" type="text" class="border-b w-16 text-center" placeholder="10,000">
                        <span class="text-[11px] text-slate-500">만원</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="font-bold w-24">연면적 평단가:</span>
                        <input id="matchGrossPyeongMin" type="text" class="border-b w-16 text-center" placeholder="1,000">
                        <span>~</span>
                        <input id="matchGrossPyeongMax" type="text" class="border-b w-16 text-center" placeholder="10,000">
                        <span class="text-[11px] text-slate-500">만원</span>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">
                    <div class="flex items-center gap-2">
                        <span class="font-bold w-24">토지면적:</span>
                        <input id="matchLandAreaMin" type="text" class="border-b w-14 text-center" placeholder="100">
                        <span>~</span>
                        <input id="matchLandAreaMax" type="text" class="border-b w-14 text-center" placeholder="500">
                        <span class="text-[11px] text-slate-500">평</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="font-bold w-24">연면적:</span>
                        <input id="matchGrossAreaMin" type="text" class="border-b w-14 text-center" placeholder="100">
                        <span>~</span>
                        <input id="matchGrossAreaMax" type="text" class="border-b w-14 text-center" placeholder="500">
                        <span class="text-[11px] text-slate-500">평</span>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">
                    <div class="flex items-center gap-2">
                        <span class="font-bold w-24">사용가능 면적:</span>
                        <input id="matchUsableAreaMin" type="text" class="border-b w-14 text-center" placeholder="100">
                        <span>~</span>
                        <input id="matchUsableAreaMax" type="text" class="border-b w-14 text-center" placeholder="500">
                        <span class="text-[11px] text-slate-500">평</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="font-bold w-24">건축면적:</span>
                        <input id="matchBuildingAreaMin" type="text" class="border-b w-14 text-center" placeholder="10">
                        <span>~</span>
                        <input id="matchBuildingAreaMax" type="text" class="border-b w-14 text-center" placeholder="500">
                        <span class="text-[11px] text-slate-500">평</span>
                    </div>
                </div>

<div class="grid grid-cols-1 lg:grid-cols-2 gap-3">
                    <div class="flex items-center gap-2">
                        <span class="font-bold w-24">사용승인:</span>
                        <input id="matchApprovalYearMin" type="text" class="border-b w-16 text-center" placeholder="2000">
                        <span class="text-[11px] text-slate-500">년 이후</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="font-bold w-24">도로폭:</span>
                        <input id="matchRoadWidthMin" type="text" class="border-b w-16 text-center" placeholder="8">
                        <span class="text-[11px] text-slate-500">m 이상</span>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">
                    <div class="flex items-center gap-2">
                        <span class="font-bold w-24">승강기:</span>
                        <select id="matchElevatorOption" class="border-b w-24 text-center outline-none bg-transparent">
                            <option value="">선택</option>
                            <option value="HAS">있음</option>
                            <option value="NONE">없음</option>
                        </select>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="font-bold w-24">주차대수:</span>
                        <input id="matchParkingMin" type="text" class="border-b w-16 text-center" placeholder="10">
                        <span class="text-[11px] text-slate-500">대 이상</span>
                    </div>
                </div>
            </div>
        </section>

        <section class="mt-4 grid grid-cols-1 xl:grid-cols-2 gap-4">
            <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
                <div class="px-4 py-2 border-b border-slate-200 bg-slate-100 font-bold text-slate-700">고객명 섹션 (<span id="customerCount">0</span>)</div>
                <div class="overflow-auto max-h-[70vh]">
                    <div id="customerBody" class="overflow-auto max-h-[70vh] p-3 space-y-3"></div>
                </div>
                <div id="insightCustomerPagination" class="px-3 py-2 border-t border-slate-200 flex items-center justify-center gap-1 flex-wrap bg-white"></div>
            </div>

            <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
                <div class="px-4 py-2 border-b border-slate-200 bg-slate-100 font-bold text-slate-700">빌딩 섹션 (<span id="buildingCount">0</span>)</div>
                <div class="overflow-auto max-h-[70vh]">
                    <div id="buildingBody" class="overflow-auto max-h-[70vh] p-3 space-y-3"></div>
                </div>
                <div id="insightBuildingPagination" class="px-3 py-2 border-t border-slate-200 flex items-center justify-center gap-1 flex-wrap bg-white"></div>
            </div>
        </section>
    </main>

    <script>
        function handleCancel() {
            if (window.opener || window.history.length === 1) {
                window.close();
            } else {
                history.back();
            }
        }

        function esc(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#39;");
        }

        function setEmptyRow(container, colspan, text) {
            const tag = (container?.tagName || "").toLowerCase();
            if (tag === "tbody") {
                container.innerHTML = `<tr><td colspan="${colspan}" class="px-3 py-6 text-center text-slate-400">${text}</td></tr>`;
                return;
            }
            container.innerHTML = `<div class="px-3 py-6 text-center text-slate-400">${text}</div>`;
        }

        function formatThousandsInputValue(raw) {
            const digits = String(raw || "").replace(/[^0-9]/g, "");
            if (!digits) return "";
            return digits.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        function customerStateText(code) {
            const map = {
                A: "A(원활) : 최근 7일 이내 소통, 실행력 높은 매수자",
                B: "B(보통) : 반응은 있으나 느림, 조건 제한 많음",
                C: "C(어려움) : 응답 지연, 반복 제안에도 무반응",
                X: "X(비활성) : 3개월 초과 미접촉, 제외 대상",
            };
            return map[code] || "-";
        }

        const INSIGHT_PAGE_SIZE = 20;
        let insightCustomerPage = 1;
        let insightBuildingPage = 1;

        function renderInsightPagination(containerId, totalPages, currentPage, onClickFnName) {
            const container = document.getElementById(containerId);
            if (!container) return;
            if (!totalPages || totalPages <= 1) {
                container.innerHTML = "";
                return;
            }

            const blockStart = Math.floor((Math.max(1, currentPage) - 1) / 5) * 5 + 1;
            const startPage = blockStart;
            const endPage = Math.min(totalPages, startPage + 4);

            const pages = Array.from({ length: endPage - startPage + 1 }, (_, i) => startPage + i);
            const firstDisabled = currentPage === 1;
            const nextPage = blockStart + 5;
            const nextDisabled = nextPage > totalPages;

            container.innerHTML = `
                <button type="button"
                    onclick="${firstDisabled ? "" : `${onClickFnName}(1)`}"
                    ${firstDisabled ? "disabled" : ""}
                    class="px-3 py-1.5 text-[12px] rounded-xl border ${firstDisabled ? "bg-slate-100 text-slate-300 border-slate-200 cursor-not-allowed" : "bg-white text-slate-600 border-slate-300 hover:bg-slate-50"}">
                    <<
                </button>
                ${pages.map((page) => `
                    <button type="button"
                        onclick="${onClickFnName}(${page})"
                        class="px-3 py-1.5 text-[12px] rounded-xl border ${page === currentPage ? "bg-blue-600 text-white border-blue-600" : "bg-white text-slate-700 border-slate-300 hover:bg-slate-50"}">
                        ${page}
                    </button>
                `).join("")}
                <button type="button"
                    onclick="${nextDisabled ? "" : `${onClickFnName}(${nextPage})`}"
                    ${nextDisabled ? "disabled" : ""}
                    class="px-3 py-1.5 text-[12px] rounded-xl border ${nextDisabled ? "bg-slate-100 text-slate-300 border-slate-200 cursor-not-allowed" : "bg-white text-slate-700 border-slate-300 hover:bg-slate-50"}">
                    다음
                </button>
            `;
        }

        function goInsightCustomerPage(page) {
            loadInsightData(page, insightBuildingPage);
        }

        function goInsightBuildingPage(page) {
            loadInsightData(insightCustomerPage, page);
        }

        async function loadInsightData(customerPage = 1, buildingPage = 1) {
            insightCustomerPage = customerPage;
            insightBuildingPage = buildingPage;
            const customerBody = document.getElementById("customerBody");
            const buildingBody = document.getElementById("buildingBody");

            const params = new URLSearchParams();
            const address = (document.getElementById("matchAddressInput")?.value || "").trim();
            const siteLocation = (document.getElementById("matchBusinessAreaInput")?.value || "").trim();
            const stationKeyword = (document.getElementById("matchStationKeyword")?.value || "").trim();
            const minYieldRaw = (document.getElementById("matchMinYieldInput")?.value || "").replace(/[^0-9.]/g, "");
            const minYield = minYieldRaw ? Number(minYieldRaw) : null;
            const stationWalkMinRaw = (document.getElementById("matchStationWalkMin")?.value || "").replace(/[^0-9.]/g, "");
            const stationWalkMaxRaw = (document.getElementById("matchStationWalkMax")?.value || "").replace(/[^0-9.]/g, "");
            const stationWalkMin = stationWalkMinRaw ? Number(stationWalkMinRaw) : null;
            const stationWalkMax = stationWalkMaxRaw ? Number(stationWalkMaxRaw) : null;
            const cashHoldManwonRaw = (document.getElementById("matchCashHoldManwon")?.value || "").replace(/[^0-9]/g, "");
            const cashHoldPercentRaw = (document.getElementById("matchCashHoldPercent")?.value || "").replace(/[^0-9.]/g, "");
            const cashHoldManwon = cashHoldManwonRaw ? Number(cashHoldManwonRaw) : null;
            const cashHoldPercent = cashHoldPercentRaw ? Number(cashHoldPercentRaw) : null;
            const elevatorOption = (document.getElementById("matchElevatorOption")?.value || "").trim();
            const buildingStatus = (document.getElementById("matchBuildingStatus")?.value || "전체").trim();
            const locationDecide = (document.getElementById("matchLocationDecide")?.value || "").trim();
            const priceDecide = (document.getElementById("matchPriceDecide")?.value || "").trim();
            const yieldDecide = (document.getElementById("matchYieldDecide")?.value || "").trim();
            const vacancyDecide = (document.getElementById("matchVacancyDecide")?.value || "").trim();
            const limitDecide = (document.getElementById("matchLimitDecide")?.value || "").trim();
            const loanDecide = (document.getElementById("matchLoanDecide")?.value || "").trim();
            const checkedTypes = Array.from(document.querySelectorAll('input[name="matchType"]:checked')).map(el => el.value);
            const checkedZoningCategories = Array.from(document.querySelectorAll('input[name="matchZoningCategory"]:checked')).map(el => el.value);
            const checkedUsageCategories = Array.from(document.querySelectorAll('input[name="matchUsageCategory"]:checked')).map(el => el.value);

            const numericIds = {
                min_price: "matchMinPrice",
                max_price: "matchMaxPrice",
                land_pp_min: "matchLandPyeongMin",
                land_pp_max: "matchLandPyeongMax",
                gross_pp_min: "matchGrossPyeongMin",
                gross_pp_max: "matchGrossPyeongMax",
                land_area_min: "matchLandAreaMin",
                land_area_max: "matchLandAreaMax",
                gross_area_min: "matchGrossAreaMin",
                gross_area_max: "matchGrossAreaMax",
                usable_area_min: "matchUsableAreaMin",
                usable_area_max: "matchUsableAreaMax",
                building_area_min: "matchBuildingAreaMin",
                building_area_max: "matchBuildingAreaMax",
                approval_year_min: "matchApprovalYearMin",
                road_width_min: "matchRoadWidthMin",
                parking_min: "matchParkingMin",
            };

            if (address) params.set("address", address);
            if (siteLocation) params.set("site_location", siteLocation);
            if (stationKeyword) params.set("station_keyword", stationKeyword);
            if (minYield !== null && !Number.isNaN(minYield)) params.set("min_yield", String(minYield));
            if (stationWalkMin !== null && !Number.isNaN(stationWalkMin)) params.set("station_walk_min", String(stationWalkMin));
            if (stationWalkMax !== null && !Number.isNaN(stationWalkMax)) params.set("station_walk_max", String(stationWalkMax));
            if (cashHoldManwon !== null && !Number.isNaN(cashHoldManwon)) params.set("cash_hold_manwon", String(cashHoldManwon));
            if (cashHoldPercent !== null && !Number.isNaN(cashHoldPercent)) params.set("cash_hold_percent", String(cashHoldPercent));
            if (elevatorOption) params.set("elevator_option", elevatorOption);
            if (buildingStatus && buildingStatus !== "전체") params.set("building_status", buildingStatus);
            if (locationDecide) params.set("location_decide", locationDecide);
            if (priceDecide) params.set("price_decide", priceDecide);
            if (yieldDecide) params.set("yield_decide", yieldDecide);
            if (vacancyDecide) params.set("vacancy_decide", vacancyDecide);
            if (limitDecide) params.set("limit_decide", limitDecide);
            if (loanDecide) params.set("loan_decide", loanDecide);
            if (checkedTypes.length) params.set("types", checkedTypes.join(","));
            if (checkedZoningCategories.length) params.set("zoning_categories", checkedZoningCategories.join(","));
            if (checkedUsageCategories.length) params.set("usage_categories", checkedUsageCategories.join(","));

            Object.entries(numericIds).forEach(([key, id]) => {
                const raw = (document.getElementById(id)?.value || "").replace(/[^0-9.]/g, "");
                if (!raw) return;
                const val = Number(raw);
                if (!Number.isNaN(val)) params.set(key, String(val));
            });

            params.set("customer_page", String(insightCustomerPage));
            params.set("building_page", String(insightBuildingPage));
            params.set("page_size", String(INSIGHT_PAGE_SIZE));

            setEmptyRow(customerBody, 1, "조회 중 오류가 발생했습니다.");
            setEmptyRow(buildingBody, 1, "조회 중...");

            try {
                const res = await fetch(`/api/insight/overview?${params.toString()}`);
                if (!res.ok) throw new Error("fetch failed");
                const payload = await res.json();

                const customers = Array.isArray(payload.customers) ? payload.customers : [];
                const buildings = Array.isArray(payload.buildings) ? payload.buildings : [];
                const customerTotalCount = Number(payload.customers_total_count ?? customers.length);
                const buildingTotalCount = Number(payload.buildings_total_count ?? buildings.length);
                const customerTotalPages = Number(payload.customers_total_pages ?? (customerTotalCount > 0 ? Math.ceil(customerTotalCount / INSIGHT_PAGE_SIZE) : 0));
                const buildingTotalPages = Number(payload.buildings_total_pages ?? (buildingTotalCount > 0 ? Math.ceil(buildingTotalCount / INSIGHT_PAGE_SIZE) : 0));
                const currentCustomerPage = Number(payload.customers_page ?? insightCustomerPage);
                const currentBuildingPage = Number(payload.buildings_page ?? insightBuildingPage);

                document.getElementById("customerCount").textContent = String(customerTotalCount);
                document.getElementById("buildingCount").textContent = String(buildingTotalCount);

                if (!customers.length) {
                    setEmptyRow(customerBody, 1, "조건에 맞는 고객이 없습니다.");
                } else {
                    customerBody.innerHTML = customers.map((row) => {
                        const desiredPrice = row.desired_price_manwon
                            ? `${formatThousandsInputValue(String(row.desired_price_manwon))}만원`
                            : "-";
                        return `
                        <div class="bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3">
                            <div class="flex items-start justify-between gap-3 mb-2">
                                <div class="flex flex-wrap items-center gap-2">
                                    <a class="text-xs font-bold text-emerald-700 bg-emerald-100 px-2 py-1 rounded" target="_blank" href="/customer/${esc(row.customer_number)}">CUSTOMER: ${esc(row.customer_number)}</a>
                                    <span class="text-xs font-bold text-blue-700 bg-blue-100 px-2 py-1 rounded">진행상황: ${esc(row.status || "-")}</span>
                                    <span class="text-xs font-bold text-slate-700 bg-slate-100 px-2 py-1 rounded">상태: ${esc(customerStateText(row.customer_state))}</span>
                                </div>
                                <a class="text-sm text-slate-400 hover:text-blue-600" target="_blank" href="/customer/${esc(row.customer_number)}">고객 상세로 이동</a>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-x-6 gap-y-1 text-[13px] text-slate-700">
                                <p>회사명: ${esc(row.buyer_name || "-")}</p>
                                <p>대표자: ${esc(row.ceo_name || "-")}</p>
                                <p>연락처: ${esc(row.phone || "-")}</p>
                                <p>이메일: ${esc(row.email || "-")}</p>
                                <p>유입경로: ${esc(row.first_contact || "-")}</p>
                                <p>매매가: ${esc(desiredPrice)}</p>
                                <p>상권: ${esc(row.business_area || "-")}</p>
                                <p>건물: ${esc(row.building_preference || "-")}</p>
                                <p>주 관심지역: ${esc(row.main_interest_region || "-")}</p>
                            </div>
                        </div>
                    `;
                    }).join("");
                }

                if (!buildings.length) {
                    setEmptyRow(buildingBody, 1, "조건에 맞는 빌딩이 없습니다.");
                } else {
                    buildingBody.innerHTML = buildings.map((row) => {
                        const flagText = [
                            row.location_decide,
                            row.price_decide,
                            row.yield_decide,
                            row.vacancy_decide,
                            row.limit_decide,
                            row.loan_decide,
                        ].map(v => (v === "선택" || !v ? "N" : v)).join("");

                        return `
                        <div class="bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3">
                            <div class="flex items-start justify-between gap-3 mb-2">
                                <div class="flex flex-wrap items-center gap-2">
                                    <a class="text-xs font-bold text-blue-700 bg-blue-100 px-2 py-1 rounded" target="_blank" href="/detail/${esc(row.bd_number)}">ID: ${esc(row.bd_number)}</a>
                                    <span class="text-xs font-bold text-indigo-700 bg-indigo-100 px-2 py-1 rounded">FLAG: ${esc(flagText)}</span>
                                </div>
                                <a class="text-sm text-slate-400 hover:text-blue-600" target="_blank" href="/detail/${esc(row.bd_number)}">새 창에서 상세정보 ↗</a>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-4 gap-x-6 gap-y-1 text-[13px] text-slate-700">
                                <p>주소: ${esc(row.address || "-")}</p>
                                <p>건물명: ${esc(row.bd_name || "-")}</p>
                                <p>매매가: ${esc(row.sale_price || "-")}</p>
                                <p>상태: ${esc(row.status || "-")}</p>
                                <p>수익률: ${esc(row.yield_rate || "-")}</p>
                                <p>대지 평: ${esc(row.land_area_pyeong || "-")}</p>
                                <p>연면적 평: ${esc(row.gross_area_pyeong || "-")}</p>
                                <p>용도지역(토지): ${esc(row.zoning_type || "-")}</p>
                                <p>승인날짜: ${esc(row.approval_date || "-")}</p>
                                <p>승강기: ${esc(row.elevator || "-")}</p>
                                <p>주차대수: ${esc(row.parking_capacity || "-")}</p>
                            </div>
                        </div>
                    `;
                    }).join("");
                }
                renderInsightPagination("insightCustomerPagination", customerTotalPages, currentCustomerPage, "goInsightCustomerPage");
                renderInsightPagination("insightBuildingPagination", buildingTotalPages, currentBuildingPage, "goInsightBuildingPage");
            } catch (e) {
                setEmptyRow(customerBody, 1, "조회 중 오류가 발생했습니다.");
                setEmptyRow(buildingBody, 1, "조회 중 오류가 발생했습니다.");
            }
        }

        document.getElementById("searchBtn").addEventListener("click", () => loadInsightData(1, 1));
        document.getElementById("resetBtn").addEventListener("click", () => {
            document.querySelectorAll("input").forEach((el) => {
                if (el.type === "checkbox") {
                    el.checked = false;
                } else if (el.id === "matchMinYieldInput") {
                    el.value = "3";
                } else {
                    el.value = "";
                }
            });
            const elevator = document.getElementById("matchElevatorOption");
            if (elevator) elevator.value = "";
            const buildingStatus = document.getElementById("matchBuildingStatus");
            if (buildingStatus) buildingStatus.selectedIndex = 0;
            ["matchLocationDecide", "matchPriceDecide", "matchYieldDecide", "matchVacancyDecide", "matchLimitDecide", "matchLoanDecide"].forEach((id) => {
                const el = document.getElementById(id);
                if (el) el.value = "";
            });
            document.getElementById("customerCount").textContent = "0";
            document.getElementById("buildingCount").textContent = "0";
            setEmptyRow(document.getElementById("customerBody"), 1, "조건을 입력하고 매칭 검색을 눌러주세요.");
            setEmptyRow(document.getElementById("buildingBody"), 1, "조건을 입력하고 매칭 검색을 눌러주세요.");
            renderInsightPagination("insightCustomerPagination", 0, 1, "goInsightCustomerPage");
            renderInsightPagination("insightBuildingPagination", 0, 1, "goInsightBuildingPage");
        });

        [
            "matchMinPrice", "matchMaxPrice", "matchCashHoldManwon", "matchLandPyeongMin", "matchLandPyeongMax",
            "matchGrossPyeongMin", "matchGrossPyeongMax", "matchLandAreaMin", "matchLandAreaMax",
            "matchGrossAreaMin", "matchGrossAreaMax", "matchUsableAreaMin", "matchUsableAreaMax",
            "matchBuildingAreaMin", "matchBuildingAreaMax", "matchApprovalYearMin", "matchParkingMin"
        ].forEach((id) => {
            const input = document.getElementById(id);
            if (!input) return;
            input.addEventListener("input", (e) => {
                e.target.value = formatThousandsInputValue(e.target.value);
            });
        });

        ["matchAddressInput", "matchBusinessAreaInput", "matchStationKeyword"].forEach((id) => {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener("keydown", (e) => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    loadInsightData(1, 1);
                }
            });
        });

        setEmptyRow(document.getElementById("customerBody"), 1, "조건을 입력하고 매칭 검색을 눌러주세요.");
        setEmptyRow(document.getElementById("buildingBody"), 1, "조건을 입력하고 매칭 검색을 눌러주세요.");
        renderInsightPagination("insightCustomerPagination", 0, 1, "goInsightCustomerPage");
        renderInsightPagination("insightBuildingPagination", 0, 1, "goInsightBuildingPage");
    </script>
</body>
</html>
