<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

<div class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
    <div class="max-w-4xl mx-auto px-6 py-8">
        <h1 class="text-2xl font-bold text-slate-800 mb-6">🏢 건물 정보 대시보드</h1>
        <div class="flex gap-2">
            <input id="addressInput" type="text" placeholder="검색할 주소를 입력하세요..."
                   class="flex-1 p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <button onclick="search()" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-semibold hover:bg-blue-700">검색하기</button>
            <button onclick="searchCustomer()" class="bg-emerald-600 text-white px-6 py-3 rounded-xl font-semibold hover:bg-emerald-700">고객검색</button>
            <button onclick="window.open('/insight', '_blank')" class="bg-indigo-600 text-white px-6 py-3 rounded-xl font-semibold hover:bg-indigo-700">통합보기</button>
        </div>
        
    </div>
</div>

<main class="max-w-4xl mx-auto px-6 py-10">
    <div class="flex justify-end mb-4">
        <div class="flex items-center gap-3 mr-auto">
            <div id="totalCount"
                class="px-4 py-2 rounded-xl border border-slate-200 bg-white
                    text-slate-700 font-semibold shadow-sm">
                전체: 0건
            </div>

            <button id="lockBtn"
                onclick="toggleSidebarLock()"
                class="flex items-center gap-2 bg-slate-700 text-white px-6 py-2.5 rounded-xl font-bold
                    hover:bg-slate-800 shadow-sm active:scale-95 transition-all">
                🔓 해제
            </button>
        </div>

        <select id="statusSelect" onchange="filterByStatus(this.value)"
                class="px-4 py-2 rounded-xl border border-slate-300 text-slate-700 font-semibold shadow-sm hover:border-blue-400 hover:text-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all mr-3">
            <option value="">전체</option>
            <option value="준비">준비</option>
            <option value="완료">완료</option>
            <option value="매각">매각</option>
            <option value="보류">보류</option>
        </select>

        <button onclick="CreateBuilding()" 
            class="flex items-center gap-2 bg-white border border-slate-200 text-slate-700 px-4 py-2 rounded-xl font-bold shadow-sm hover:bg-slate-50 hover:border-blue-400 hover:text-blue-600 transition-all mr-1">
            <span class="flex items-center justify-center w-6 h-6 bg-blue-100 text-blue-600 rounded-md text-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4" />
                </svg>
            </span>
            새 건물 등록
        </button>


        <button onclick="CreateCustomer()" 
            class="flex items-center gap-2 bg-white border border-slate-200 text-slate-700 px-4 py-2 rounded-xl font-bold shadow-sm hover:bg-slate-50 hover:border-blue-400 hover:text-blue-600 transition-all">
            <span class="flex items-center justify-center w-6 h-6 bg-blue-100 text-blue-600 rounded-md text-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4" />
                </svg>
            </span>
            새 고객 등록
        </button>
    </div>
    
    <div id="loading" class="hidden text-center py-10">
        <div class="animate-spin inline-block w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full"></div>
        <p class="mt-2 text-slate-500">데이터를 불러오는 중...</p>
    </div>
    
    <div id="resultCount" class="mb-4 text-sm text-slate-500 font-medium"></div>

    <div id="addressList" class="grid gap-4"></div>
    
    <div id="pagination" class="flex justify-center gap-1 mt-10"></div>
</main>

<script src="/statics/js/building-main.js"></script>
</body>
</html>
