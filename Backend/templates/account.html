<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center px-4">
    <div class="w-full max-w-md bg-white border border-slate-200 rounded-2xl shadow-lg p-6">
        <div class="flex items-center justify-between gap-3">
            <h1 class="text-2xl font-bold text-slate-800">계정</h1>
            <a href="/"
               class="inline-flex items-center rounded-lg border border-slate-300 px-3 py-1.5 text-sm font-semibold text-slate-700 hover:bg-slate-100">
                뒤로
            </a>
        </div>
        <p class="mt-1 text-sm text-slate-500">이름을 변경할 수 있습니다.</p>

        <div class="mt-6 space-y-4">
            <div>
                <p class="block text-sm font-semibold text-slate-700 mb-1">아이디</p>
                <p id="usernameValue"
                   class="w-full rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-slate-700">-</p>
            </div>

            <form id="profileForm" class="space-y-4">
                <div>
                    <label for="displayName" class="block text-sm font-semibold text-slate-700 mb-1">표시 이름</label>
                    <input id="displayName" type="text" maxlength="80"
                           class="w-full border border-slate-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                           placeholder="Display name">
                </div>
                <p id="profileMessage" class="hidden text-sm"></p>
                <button id="saveBtn" type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg transition">
                    저장
                </button>
            </form>
        </div>

        <div id="adminSignupControlSection"
             class="hidden mt-6 rounded-xl border border-slate-200 bg-slate-50 p-4 space-y-3">
            <div class="flex items-center justify-between gap-3">
                <div>
                    <p class="text-sm font-bold text-slate-800">관리자 세팅</p>
                    <p class="text-xs text-slate-500">체크시 회원가입 허용</p>
                </div>
                <label class="inline-flex items-center gap-2 text-sm font-semibold text-slate-700">
                    <input id="signupEnabledToggle" type="checkbox" class="h-4 w-4 accent-blue-600">
                    회의가입 허용 여부
                </label>
            </div>
            <button id="signupControlSaveBtn" type="button"
                    class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 rounded-lg transition">
                회원가입 세팅 저장
            </button>
            <p id="signupControlMessage" class="hidden text-sm"></p>
        </div>

        <div id="adminBugReportEntrySection"
             class="hidden mt-4 rounded-xl border border-slate-200 bg-slate-50 p-4 space-y-3">
            <div>
                <p class="text-sm font-bold text-slate-800">버그 신고 관리</p>
                <p class="text-xs text-slate-500">접수된 버그 목록, 본문, 스크린샷, 해결 여부를 확인합니다.</p>
            </div>
            <a href="/admin/bug-reports"
               class="inline-flex w-full items-center justify-center rounded-lg bg-amber-500 px-3 py-2.5 text-sm font-bold text-white transition hover:bg-amber-600">
                버그 신고 관리 열기
            </a>
        </div>

        <div id="adminNoticeSection"
             class="hidden mt-4 rounded-xl border border-slate-200 bg-slate-50 p-4 space-y-3">
            <div>
                <p class="text-sm font-bold text-slate-800">공지사항</p>
                <p class="text-xs text-slate-500">메인 화면 팝업에 표시됩니다.</p>
            </div>
            <div class="space-y-2">
                <input id="noticeTitleInput" type="text" maxlength="120"
                       class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                       placeholder="공지 제목 (선택)">
                <textarea id="noticeContentInput" rows="5" maxlength="10000"
                          class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 resize-y"
                          placeholder="공지 내용을 입력하세요."></textarea>
                <div class="flex items-center justify-between gap-2">
                    <button id="noticeImagePickBtn" type="button"
                            class="inline-flex items-center rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-xs font-semibold text-slate-700 hover:bg-slate-100">
                        스크린샷 넣기
                    </button>
                    <input id="noticeImageInput" type="file" accept="image/*" multiple class="hidden">
                    <span class="text-xs text-slate-500">붙여넣기(Ctrl+V) 지원</span>
                </div>
                <label class="inline-flex items-center gap-2 text-sm font-semibold text-slate-700">
                    <input id="noticeEnabledToggle" type="checkbox" class="h-4 w-4 accent-blue-600">
                    메인 팝업 활성화
                </label>
            </div>
            <button id="noticeSaveBtn" type="button"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg transition">
                공지사항 저장
            </button>
            <p id="noticeMessage" class="hidden text-sm"></p>
        </div>

        <a href="/logout"
           class="mt-5 inline-flex items-center rounded-lg border border-red-200 bg-red-50 px-3 py-1.5 text-sm font-semibold text-red-600 hover:bg-red-100">
            로그아웃
        </a>
    </div>

    <script>
        const usernameValue = document.getElementById("usernameValue");
        const displayNameInput = document.getElementById("displayName");
        const profileForm = document.getElementById("profileForm");
        const profileMessage = document.getElementById("profileMessage");
        const saveBtn = document.getElementById("saveBtn");

        const adminSignupControlSection = document.getElementById("adminSignupControlSection");
        const adminBugReportEntrySection = document.getElementById("adminBugReportEntrySection");
        const signupEnabledToggle = document.getElementById("signupEnabledToggle");
        const signupControlSaveBtn = document.getElementById("signupControlSaveBtn");
        const signupControlMessage = document.getElementById("signupControlMessage");

        const adminNoticeSection = document.getElementById("adminNoticeSection");
        const noticeTitleInput = document.getElementById("noticeTitleInput");
        const noticeContentInput = document.getElementById("noticeContentInput");
        const noticeImagePickBtn = document.getElementById("noticeImagePickBtn");
        const noticeImageInput = document.getElementById("noticeImageInput");
        const noticeEnabledToggle = document.getElementById("noticeEnabledToggle");
        const noticeSaveBtn = document.getElementById("noticeSaveBtn");
        const noticeMessage = document.getElementById("noticeMessage");
        let noticeImageUploadInFlight = false;

        function setMessage(text, type) {
            profileMessage.classList.remove("hidden", "text-red-600", "text-emerald-600");
            profileMessage.classList.add(type === "success" ? "text-emerald-600" : "text-red-600");
            profileMessage.textContent = text;
        }

        function setSignupControlMessage(text, type) {
            if (!signupControlMessage) return;
            signupControlMessage.classList.remove("hidden", "text-red-600", "text-emerald-600");
            signupControlMessage.classList.add(type === "success" ? "text-emerald-600" : "text-red-600");
            signupControlMessage.textContent = text;
        }

        function setNoticeMessage(text, type) {
            if (!noticeMessage) return;
            noticeMessage.classList.remove("hidden", "text-red-600", "text-emerald-600");
            noticeMessage.classList.add(type === "success" ? "text-emerald-600" : "text-red-600");
            noticeMessage.textContent = text;
        }

        function insertTextAtCursor(textareaEl, text) {
            if (!textareaEl) return;
            const start = Number.isInteger(textareaEl.selectionStart)
                ? textareaEl.selectionStart
                : textareaEl.value.length;
            const end = Number.isInteger(textareaEl.selectionEnd)
                ? textareaEl.selectionEnd
                : textareaEl.value.length;

            const before = textareaEl.value.slice(0, start);
            const after = textareaEl.value.slice(end);
            textareaEl.value = `${before}${text}${after}`;

            const cursor = start + text.length;
            textareaEl.focus();
            textareaEl.setSelectionRange(cursor, cursor);
        }

        function normalizeNoticeImageUrl(rawUrl) {
            const value = String(rawUrl || "").trim();
            if (!value) return "";
            if (value.startsWith("/photo/notice/")) return value;

            try {
                const parsed = new URL(value, window.location.origin);
                if (parsed.origin !== window.location.origin) return "";
                if (!parsed.pathname.startsWith("/photo/notice/")) return "";
                return `${parsed.pathname}${parsed.search}${parsed.hash}`;
            } catch (err) {
                return "";
            }
        }

        async function uploadNoticeImageFile(file) {
            if (!file) {
                throw new Error("이미지 파일이 없습니다.");
            }
            if (String(file.type || "").toLowerCase().indexOf("image/") !== 0) {
                throw new Error("이미지 파일만 업로드할 수 있습니다.");
            }

            const formData = new FormData();
            formData.append("file", file, file.name || "notice-image.png");

            const res = await fetch("/api/admin/notice/image", {
                method: "POST",
                body: formData,
            });
            const payload = await res.json().catch(() => ({}));
            if (!res.ok) {
                throw new Error(payload.detail || "스크린샷 업로드에 실패했습니다.");
            }

            const normalizedUrl = normalizeNoticeImageUrl(payload?.url);
            if (!normalizedUrl) {
                throw new Error("업로드 결과 URL이 올바르지 않습니다.");
            }
            return normalizedUrl;
        }

        async function insertNoticeImages(fileList) {
            if (!noticeContentInput) return;
            const files = Array.from(fileList || []).filter(Boolean);
            if (!files.length) return;

            noticeImageUploadInFlight = true;
            if (noticeSaveBtn) noticeSaveBtn.disabled = true;
            if (noticeImagePickBtn) noticeImagePickBtn.disabled = true;

            let inserted = 0;
            try {
                for (const file of files) {
                    const imageUrl = await uploadNoticeImageFile(file);
                    insertTextAtCursor(noticeContentInput, `\n![screenshot](${imageUrl})\n`);
                    inserted += 1;
                }
                if (inserted > 0) {
                    setNoticeMessage(`스크린샷 ${inserted}개를 본문에 넣었습니다.`, "success");
                }
            } catch (error) {
                setNoticeMessage(error.message || "스크린샷 업로드 중 오류가 발생했습니다.", "error");
            } finally {
                noticeImageUploadInFlight = false;
                if (noticeSaveBtn) noticeSaveBtn.disabled = false;
                if (noticeImagePickBtn) noticeImagePickBtn.disabled = false;
            }
        }

        async function loadSignupControl() {
            if (!signupEnabledToggle) return;

            const res = await fetch("/api/auth/signup-control");
            if (!res.ok) {
                const payload = await res.json().catch(() => ({}));
                throw new Error(payload.detail || "Failed to load signup setting.");
            }

            const payload = await res.json();
            signupEnabledToggle.checked = Boolean(payload.signup_enabled);
        }

        async function loadAdminNotice() {
            if (!noticeTitleInput || !noticeContentInput || !noticeEnabledToggle) return;

            const res = await fetch("/api/admin/notice");
            if (!res.ok) {
                const payload = await res.json().catch(() => ({}));
                throw new Error(payload.detail || "Failed to load notice.");
            }

            const payload = await res.json();
            const notice = payload?.notice || {};
            noticeTitleInput.value = String(notice.title || "");
            noticeContentInput.value = String(notice.content || "");
            noticeEnabledToggle.checked = Boolean(notice.enabled);
        }

        async function loadProfile() {
            const res = await fetch("/api/auth/me");
            if (!res.ok) {
                throw new Error("Failed to load account info.");
            }

            const payload = await res.json();
            const user = payload?.user || {};
            const username = String(user.username || "").trim();
            const displayName = String(user.display_name || "").trim();

            usernameValue.textContent = username || "-";
            displayNameInput.value = displayName;

            const isAdmin = Boolean(user.admin_flag);
            if (adminSignupControlSection) {
                adminSignupControlSection.classList.toggle("hidden", !isAdmin);
            }
            if (adminBugReportEntrySection) {
                adminBugReportEntrySection.classList.toggle("hidden", !isAdmin);
            }
            if (adminNoticeSection) {
                adminNoticeSection.classList.toggle("hidden", !isAdmin);
            }

            if (isAdmin) {
                try {
                    await loadSignupControl();
                } catch (error) {
                    setSignupControlMessage(
                        error.message || "Failed to load signup setting.",
                        "error"
                    );
                }

                try {
                    await loadAdminNotice();
                } catch (error) {
                    setNoticeMessage(
                        error.message || "Failed to load notice.",
                        "error"
                    );
                }
            }
        }

        profileForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            profileMessage.classList.add("hidden");

            const displayName = displayNameInput.value.trim();
            saveBtn.disabled = true;
            try {
                const res = await fetch("/api/auth/me", {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        display_name: displayName || null,
                    }),
                });
                if (!res.ok) {
                    const payload = await res.json().catch(() => ({}));
                    throw new Error(payload.detail || "Failed to save display name.");
                }

                const payload = await res.json();
                const user = payload?.user || {};
                const updatedDisplayName = String(user.display_name || "").trim();
                displayNameInput.value = updatedDisplayName;
                setMessage("Saved successfully.", "success");
            } catch (error) {
                setMessage(error.message || "Error while saving.", "error");
            } finally {
                saveBtn.disabled = false;
            }
        });

        signupControlSaveBtn?.addEventListener("click", async () => {
            if (!signupEnabledToggle) return;
            if (signupControlMessage) signupControlMessage.classList.add("hidden");

            signupControlSaveBtn.disabled = true;
            try {
                const res = await fetch("/api/auth/signup-control", {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        signup_enabled: signupEnabledToggle.checked,
                    }),
                });
                if (!res.ok) {
                    const payload = await res.json().catch(() => ({}));
                    throw new Error(payload.detail || "Failed to save signup setting.");
                }

                const payload = await res.json();
                signupEnabledToggle.checked = Boolean(payload.signup_enabled);
                setSignupControlMessage("Signup setting saved.", "success");
            } catch (error) {
                setSignupControlMessage(error.message || "Error while saving setting.", "error");
            } finally {
                signupControlSaveBtn.disabled = false;
            }
        });

        noticeImagePickBtn?.addEventListener("click", () => {
            noticeImageInput?.click();
        });

        noticeImageInput?.addEventListener("change", async (event) => {
            const selectedFiles = event.target?.files || [];
            await insertNoticeImages(selectedFiles);
            event.target.value = "";
        });

        noticeContentInput?.addEventListener("paste", (event) => {
            const clipboardItems = Array.from(event.clipboardData?.items || []);
            const imageFiles = clipboardItems
                .filter((item) => String(item?.type || "").toLowerCase().startsWith("image/"))
                .map((item) => item.getAsFile())
                .filter(Boolean);

            if (!imageFiles.length) return;
            event.preventDefault();
            insertNoticeImages(imageFiles);
        });

        noticeSaveBtn?.addEventListener("click", async () => {
            if (!noticeTitleInput || !noticeContentInput || !noticeEnabledToggle) return;
            if (noticeMessage) noticeMessage.classList.add("hidden");
            if (noticeImageUploadInFlight) {
                setNoticeMessage("스크린샷 업로드가 끝난 뒤 저장해 주세요.", "error");
                return;
            }

            noticeSaveBtn.disabled = true;
            try {
                const res = await fetch("/api/admin/notice", {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        title: noticeTitleInput.value.trim(),
                        content: noticeContentInput.value,
                        enabled: noticeEnabledToggle.checked,
                    }),
                });
                if (!res.ok) {
                    const payload = await res.json().catch(() => ({}));
                    throw new Error(payload.detail || "Failed to save notice.");
                }

                const payload = await res.json();
                const notice = payload?.notice || {};
                noticeTitleInput.value = String(notice.title || "");
                noticeContentInput.value = String(notice.content || "");
                noticeEnabledToggle.checked = Boolean(notice.enabled);
                setNoticeMessage("Notice saved.", "success");
            } catch (error) {
                setNoticeMessage(error.message || "Error while saving notice.", "error");
            } finally {
                noticeSaveBtn.disabled = false;
            }
        });

        loadProfile().catch((error) => {
            setMessage(error.message || "Failed to load account info.", "error");
        });
    </script>
    <script src="/statics/js/bug-report-widget.js"></script>
</body>
</html>
