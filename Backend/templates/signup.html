<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center px-4">
    <div class="w-full max-w-md bg-white border border-slate-200 rounded-2xl shadow-lg p-6">
        <h1 class="text-2xl font-bold text-slate-800">회원가입</h1>
        <p class="mt-1 text-sm text-slate-500">아이디/비밀번호로 계정을 생성합니다.</p>

        <form id="signupForm" class="mt-6 space-y-4">
            <input id="nextPath" type="hidden" value="{{ next }}">
            <div>
                <label for="username" class="block text-sm font-semibold text-slate-700 mb-1">아이디</label>
                <input id="username" type="text" autocomplete="username"
                    class="w-full border border-slate-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                    placeholder="4~32자: 영문, 숫자, ., _, -">
            </div>
            <div>
                <label for="displayName" class="block text-sm font-semibold text-slate-700 mb-1">표시 이름 (선택)</label>
                <input id="displayName" type="text"
                    class="w-full border border-slate-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100">
            </div>
            <div>
                <label for="password" class="block text-sm font-semibold text-slate-700 mb-1">비밀번호</label>
                <input id="password" type="password" autocomplete="new-password"
                    class="w-full border border-slate-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                    placeholder="최소 8자">
            </div>
            <div>
                <label for="passwordConfirm" class="block text-sm font-semibold text-slate-700 mb-1">비밀번호 확인</label>
                <input id="passwordConfirm" type="password" autocomplete="new-password"
                    class="w-full border border-slate-300 rounded-lg px-3 py-2 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100">
            </div>
            <p id="signupError" class="hidden text-sm text-red-600"></p>
            <button id="signupBtn" type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg transition">
                회원가입
            </button>
        </form>

        <div class="mt-4 text-sm text-slate-600">
            이미 계정이 있으면
            <a id="loginLink" href="/login" class="font-semibold text-blue-600 hover:underline">로그인</a>
        </div>
    </div>

    <script>
        const form = document.getElementById("signupForm");
        const signupBtn = document.getElementById("signupBtn");
        const signupError = document.getElementById("signupError");
        const nextPathInput = document.getElementById("nextPath");
        const loginLink = document.getElementById("loginLink");

        function safeNextPath(path) {
            const value = String(path || "").trim();
            if (!value.startsWith("/") || value.startsWith("//")) return "/";
            return value;
        }

        const safeNext = safeNextPath(nextPathInput?.value || "/");
        loginLink.href = `/login?next=${encodeURIComponent(safeNext)}`;

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            signupError.classList.add("hidden");

            const username = document.getElementById("username").value.trim();
            const displayName = document.getElementById("displayName").value.trim();
            const password = document.getElementById("password").value;
            const passwordConfirm = document.getElementById("passwordConfirm").value;

            if (!username || !password) {
                signupError.textContent = "아이디와 비밀번호를 입력해 주세요.";
                signupError.classList.remove("hidden");
                return;
            }
            if (password !== passwordConfirm) {
                signupError.textContent = "비밀번호 확인이 일치하지 않습니다.";
                signupError.classList.remove("hidden");
                return;
            }

            signupBtn.disabled = true;
            try {
                const res = await fetch("/api/auth/signup", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username,
                        password,
                        display_name: displayName || null,
                    }),
                });
                if (!res.ok) {
                    const payload = await res.json().catch(() => ({}));
                    throw new Error(payload.detail || "회원가입에 실패했습니다.");
                }

                window.location.href = `/login?signup=1&next=${encodeURIComponent(safeNext)}`;
            } catch (err) {
                signupError.textContent = err.message || "회원가입 중 오류가 발생했습니다.";
                signupError.classList.remove("hidden");
            } finally {
                signupBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
